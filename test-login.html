<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - CyberEdu</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #0f0;
            padding: 20px;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border: 2px solid #0f0;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        
        h1 {
            color: #00ff00;
            text-shadow: 0 0 10px #0f0;
            margin-top: 0;
        }
        
        .test-item {
            margin: 15px 0;
            padding: 10px;
            border-left: 4px solid #0f0;
            background: rgba(0,255,0,0.05);
        }
        
        .pass { border-left-color: #00ff00; }
        .fail { border-left-color: #ff4444; }
        .warn { border-left-color: #ffaa00; }
        
        .status {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .pass .status { color: #00ff00; }
        .fail .status { color: #ff4444; }
        .warn .status { color: #ffaa00; }
        
        code {
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            border-radius: 3px;
            display: inline-block;
            margin: 2px 0;
        }
        
        .form-test {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,255,0,0.05);
            border: 1px dashed #0f0;
            border-radius: 5px;
        }
        
        .form-test h2 {
            margin-top: 0;
        }
        
        input {
            background: rgba(0,0,0,0.5);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            font-family: inherit;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
        
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
            font-family: inherit;
        }
        
        button:hover {
            background: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test de Login - CyberEdu</h1>
        
        <div id="tests"></div>
        
        <div class="form-test">
            <h2>Prueba de Login Real</h2>
            <p>Usa estas credenciales para probar:</p>
            <ul>
                <li>Usuario: <code>admin</code></li>
                <li>Contraseña: <code>123456</code></li>
            </ul>
            
            <form action="login.php" method="POST" onsubmit="testLogin(event)">
                <div>
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" value="admin" required>
                </div>
                
                <div>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" value="123456" required>
                </div>
                
                <div>
                    <label>
                        <input type="checkbox" name="remember" value="1">
                        Recuérdame
                    </label>
                </div>
                
                <button type="submit">Probar Login</button>
            </form>
        </div>
    </div>
    
    <script>
        // Realizar tests
        fetch('diagnostico.php')
            .then(response => response.text())
            .then(html => {
                // Extraer información de diagnóstico
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const diagnostics = doc.querySelectorAll('.diagnostic');
                
                let results = [];
                diagnostics.forEach((diag, index) => {
                    const isPass = diag.classList.contains('pass');
                    const isFail = diag.classList.contains('fail');
                    const isWarn = diag.classList.contains('warn');
                    const title = diag.querySelector('h2')?.textContent || 'Unknown';
                    const content = diag.innerHTML;
                    
                    let status = '?';
                    let className = '';
                    
                    if (isPass) {
                        status = '✓ PASS';
                        className = 'pass';
                    } else if (isFail) {
                        status = '✗ FAIL';
                        className = 'fail';
                    } else if (isWarn) {
                        status = '⚠ WARN';
                        className = 'warn';
                    }
                    
                    results.push({ title, status, className, content });
                });
                
                // Mostrar resultados
                const testsDiv = document.getElementById('tests');
                results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = `test-item ${result.className}`;
                    item.innerHTML = `<span class="status">${result.status}</span><strong>${result.title}</strong>`;
                    testsDiv.appendChild(item);
                });
            })
            .catch(error => {
                console.error('Error cargando diagnóstico:', error);
                const testsDiv = document.getElementById('tests');
                const item = document.createElement('div');
                item.className = 'test-item fail';
                item.innerHTML = '<span class="status">✗ ERROR</span><strong>No se pudo cargar diagnóstico.php</strong>';
                testsDiv.appendChild(item);
            });
        
        function testLogin(event) {
            // Permitir que el formulario se envíe normalmente
            // Lo que hará es redirigir a login.php con las credenciales
            console.log('Enviando credenciales a login.php...');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCÉS // TERMINAL</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="matrix" width="800" height="600"></canvas>

    <div class="container">
        <div class="logo">
            <h1 class="glitch" data-text="ROOT@SISTEMA">ROOT@SISTEMA</h1>
            <p class="subtitle">ACCÉS NO AUTORITZAT SERÀ REGISTRAT</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form method="POST" action="login.php" id="loginForm" onsubmit="return validateForm()">
            
            <div class="form-group">
                <label for="username">[ USUARI / CORREU ]</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="INTRODUEIX L'IDENTIFICADOR..."
                    required
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="password">[ CONTRASENYA ]</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="************"
                    required
                    autocomplete="off"
                >
            </div>

            <div class="form-group checkbox">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">MANTÉ LA SESSIÓ</label>
            </div>

            <button type="submit" class="submit-btn">EXECUTA L'ACCÉS</button>
        </form>

        <div class="divider">// OPCIONS DE BREtxA //</div>

        <div class="footer-links">
            <a href="register.html">CREA USUARI NOU</a>
            <a href="forgot-password.html">RECUPERA CREDENCIALS</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
        function validateForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!username) {
                showError('CAL IDENTIFICADOR');
                return false;
            }

            if (!password) {
                showError('CAL SEQÜÈNCIA DE CLAU');
                return false;
            }

            if (password.length < 6) {
                showError('LONGITUD DE CLAU INSUFICIENT (mín. 6)');
                return false;
            }

            return true;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '[!] ' + message;
            errorDiv.style.display = 'block';
        }

        // Matrix rain background (el mateix codi d'abans)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン█▓▒░→←↑↓↔⚡★☆■□▪▫';
        const fontSize = 14;
        const columns = canvas.width / fontSize;

        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px Fira Code, monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 35);

        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔐 Login</h1>
            <p>Bienvenido a tu aplicación</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form method="POST" action="login.php" id="loginForm" onsubmit="return validateForm()">
            
            <div class="form-group">
                <label for="username">Usuario o Email</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Ingresa tu usuario o email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <div class="form-group checkbox">
                <input 
                    type="checkbox" 
                    id="remember" 
                    name="remember"
                >
                <label for="remember">Recuerda mis datos</label>
            </div>

            <button type="submit" class="submit-btn">Iniciar Sesión</button>

        </form>

        <div class="divider">o</div>

        <div class="footer-links">
            <a href="register.html">Regístrate</a>
            <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script>
        function validateForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!username) {
                showError('Por favor ingresa tu usuario o email');
                return false;
            }

            if (!password) {
                showError('Por favor ingresa tu contraseña');
                return false;
            }

            if (password.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres');
                return false;
            }

            return true;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            if (!validateForm()) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
